<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
    <title>RIBBON 2</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://unpkg.com/htmx.org@1.9.4"></script>
    <script src="/web/static/bootstrap.bundle.min.js" defer></script>
    <script src="/web/static/modal.js" defer></script>
    <script src="/web/static/panes.js" defer></script>
    <script src="/web/static/directories.js" defer></script>
    <script src="/web/static/messages.js" defer></script>
    <link href="/web/static/bootstrap.min.css" rel="stylesheet">
    <link href="/web/static/main.css" rel="stylesheet">
</head>
<body>
<header class="app-header navbar navbar-dark bg-dark px-3">
    <a class="navbar-brand fw-semibold" href="/">Ribbon 2</a>
    <div class="d-flex align-items-center gap-3">
        <span class="text-white-50">Hi, ${user.login}!</span>
        <a class="btn btn-sm btn-success" href="/editor/CREATE" role="button">Create message</a>
        <button type="button" hx-post="/logout" class="btn btn-sm btn-outline-light">Logout</button>
    </div>
</header>

<main class="workspace" id="workspace">
    <aside class="pane pane-directories" aria-label="Isle A: directories">
        <div class="pane-body directory-list" id="dirs" hx-trigger="load, every 60s" hx-get="/directories">
            <div class="text-body-secondary small">Loading directories…</div>
        </div>
    </aside>

    <div class="splitter splitter-columns" role="separator" aria-label="Resize directory panel" aria-orientation="vertical" tabindex="0" data-resize="columns"></div>

    <section class="right-stack" aria-label="Messages and message content">
        <section class="pane pane-messages" aria-label="Isle B: messages">
            <div class="pane-body message-list" id="messages">
                <div class="empty-state">Select a directory to display its messages.</div>
            </div>
        </section>

        <div class="splitter splitter-rows" role="separator" aria-label="Resize message list" aria-orientation="horizontal" tabindex="0" data-resize="rows"></div>

        <section class="pane pane-content" aria-label="Isle C: message content">
            <div class="pane-body content-view" id="content">
                <div class="empty-state">Select a message to read its content.</div>
            </div>
        </section>
    </section>
</main>
</body>
</html>
