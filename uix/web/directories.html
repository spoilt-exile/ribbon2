<#macro dirTreeList dirList>
    <#list dirList as childDir>
        <li>
            <a class="directory-link" href="#"
               data-directory="${childDir.parentDirectory.fullName}"
               aria-current="false"
               hx-get="/messages/${childDir.parentDirectory.fullName}"
               hx-target="#messages">${childDir.parentDirectory.name}</a>
            <#if childDir.directoryChildren?has_content>
                <ul>
                    <@dirTreeList childDir.directoryChildren />
                </ul>
            </#if>
        </li>
    </#list>
</#macro>

<ul class="directory-tree" id="directory-tree">
<@dirTreeList directories.directoryChildren />
</ul>
